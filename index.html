<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed">
<title>Весёлое умножение 1–9 × 2–5</title>
<style>
:root{font-family:Nunito,ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#2d2140;--page-bg:linear-gradient(145deg,#dff7ff,#f4e7ff 45%,#fff1c7);--blob1:#86efac;--blob2:#f9a8d4;--card-bg:linear-gradient(135deg,#8b5cf6,#6366f1);--card-shadow:#ddd6fe}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--page-bg);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.45;z-index:-1}body:before{width:260px;height:260px;background:var(--blob1);left:-90px;top:-80px}body:after{width:320px;height:320px;background:var(--blob2);right:-130px;bottom:-100px}
.app{width:min(100%,540px);background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:32px;padding:22px;box-shadow:0 20px 55px rgba(92,50,140,.18);backdrop-filter:blur(10px);position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:19px;font-weight:900}.progress{background:#ede9fe;color:#6d28d9;padding:7px 11px;border-radius:99px;font-weight:900;font-variant-numeric:tabular-nums}
.topline{display:flex;justify-content:space-between;align-items:center;margin:13px 2px 7px;font-weight:900}.streak{color:#ea580c}.stars{color:#ca8a04}
.bar{height:12px;background:#ede9fe;border-radius:99px;overflow:hidden;margin:0 0 22px}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b);transition:width .3s;border-radius:99px}
.card{position:relative;background:var(--card-bg);border-radius:27px;padding:24px 16px 25px;box-shadow:0 12px 0 var(--card-shadow),0 20px 32px rgba(99,102,241,.2);margin-bottom:22px;overflow:hidden;transition:background .35s ease,box-shadow .35s ease}.theme-label{text-align:center;color:rgba(255,255,255,.92);font-size:13px;font-weight:1000;letter-spacing:.3px;margin-bottom:2px}.card:before,.card:after{content:"★";position:absolute;color:rgba(255,255,255,.2);font-size:56px}.card:before{left:18px;top:8px;transform:rotate(-18deg)}.card:after{right:17px;bottom:-9px;transform:rotate(17deg)}
.mascot{text-align:center;font-size:38px;height:44px;animation:float 2.2s ease-in-out infinite}.problem{text-align:center;color:#fff;font-size:64px;font-weight:1000;letter-spacing:-2px;text-shadow:0 3px 0 rgba(0,0,0,.1);margin:5px 0}
.reviewtag{text-align:center;color:#ede9fe;font-weight:900;font-size:13px;min-height:18px}
.answer{width:100%;font-size:38px;font-weight:900;text-align:center;padding:14px;border:3px solid #ddd6fe;border-radius:18px;outline:none;background:#fff}.answer:focus{border-color:#8b5cf6;box-shadow:0 0 0 5px #ede9fe}
.feedback{min-height:50px;display:grid;place-items:center;text-align:center;margin:9px 0;font-weight:900;font-size:16px;line-height:1.25}.ok{color:#15803d}.bad{color:#b45309}
.buttons{display:grid;grid-template-columns:1.45fr .75fr;gap:10px}.btn{border:0;border-radius:16px;padding:15px 12px;font-size:16px;font-weight:900;cursor:pointer;transition:transform .1s}.btn:active{transform:translateY(2px)}.primary{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;box-shadow:0 6px 0 #ddd6fe}.secondary{background:#f3f4f6;color:#6b7280}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}.stat{background:#faf5ff;border-radius:16px;padding:11px 6px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#7c6f8f;font-weight:800}
.panel{margin-top:18px;padding-top:18px;border-top:1px solid #eee}.panel h2{font-size:15px;margin:0 0 10px}.mistakes{margin:0;padding-left:20px;color:#6b5c76}.hidden{display:none}.finish{text-align:center}.finish h1{font-size:29px;margin:8px}.finish .trophy{font-size:70px}.finish .big{font-size:52px;font-weight:1000;color:#7c3aed;margin:8px}
.pop{animation:pop .35s ease}.shake{animation:shake .35s ease}.confetti{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:confetti 900ms ease-out forwards}
@keyframes pop{50%{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes confetti{to{transform:translate(var(--x),var(--y)) rotate(420deg);opacity:0}}
@media(max-width:420px){.app{padding:16px;border-radius:24px}.problem{font-size:55px}.card{padding:23px 12px 20px}.title{font-size:17px}}
</style>
</head><body>
<main class="app" id="app">
<section id="game">
<header><div class="title">🌈 Весёлое умножение</div><div class="progress" id="progress">1 / 30</div></header>
<div class="topline"><span class="stars" id="stars">⭐ 0</span><span class="streak" id="streak">🔥 0 подряд</span></div>
<div class="bar"><div id="bar"></div></div>
<div class="card" id="card"><div class="theme-label" id="themeLabel">🌈 Радуга</div><div class="mascot" id="mascot">🦊</div><div class="problem" id="problem">8 × 4</div><div class="reviewtag" id="reviewtag"></div></div>
<form id="form"><input id="answer" class="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="Ответ"><div id="feedback" class="feedback">Какой получится ответ? 🤔</div><div class="buttons"><button class="btn primary" type="submit">Проверить ✨</button><button class="btn secondary" id="restart" type="button">Заново</button></div></form>
<div class="stats"><div class="stat"><b id="correct">0</b><span>⭐ правильно</span></div><div class="stat"><b id="errors">0</b><span>🌱 учимся</span></div><div class="stat"><b id="accuracy">—</b><span>🎯 точность</span></div></div>
</section>
<section id="finish" class="finish hidden"><div class="trophy">🏆</div><h1>Раунд пройден!</h1><div class="big" id="finalAccuracy">100%</div><p id="finalSummary"></p><div class="panel"><h2>Что мы потренировали</h2><ul id="mistakes" class="mistakes"></ul></div><div class="buttons" style="margin-top:20px"><button class="btn primary" id="again">Ещё 30 🚀</button><button class="btn secondary" id="clearHistory">Сбросить историю</button></div></section>
</main>
<script>
(()=>{
const MAIN_ATTEMPTS=30,FIRST=[1,2,3,4,5,6,7,8,9],SECOND=[2,3,4,5],$=id=>document.getElementById(id);
const els={app:$('app'),game:$('game'),finish:$('finish'),progress:$('progress'),bar:$('bar'),problem:$('problem'),answer:$('answer'),feedback:$('feedback'),correct:$('correct'),errors:$('errors'),accuracy:$('accuracy'),finalAccuracy:$('finalAccuracy'),finalSummary:$('finalSummary'),mistakes:$('mistakes'),card:$('card'),mascot:$('mascot'),streak:$('streak'),stars:$('stars'),reviewtag:$('reviewtag'),themeLabel:$('themeLabel')};
const themes=[
{name:'🚀 Космос',page:'linear-gradient(145deg,#dbeafe,#ede9fe,#111827)',blob1:'#818cf8',blob2:'#c084fc',card:'linear-gradient(135deg,#312e81,#7c3aed)',shadow:'#c4b5fd',mascots:['🚀','🪐','👩‍🚀','👽']},
{name:'🌊 Океан',page:'linear-gradient(145deg,#cffafe,#dbeafe,#e0f2fe)',blob1:'#22d3ee',blob2:'#60a5fa',card:'linear-gradient(135deg,#0284c7,#06b6d4)',shadow:'#a5f3fc',mascots:['🐬','🐙','🐳','🦀']},
{name:'🌴 Джунгли',page:'linear-gradient(145deg,#dcfce7,#fef9c3,#bbf7d0)',blob1:'#4ade80',blob2:'#facc15',card:'linear-gradient(135deg,#15803d,#65a30d)',shadow:'#bbf7d0',mascots:['🐯','🦜','🐵','🦥']},
{name:'🍭 Сладости',page:'linear-gradient(145deg,#fce7f3,#ffedd5,#fdf2f8)',blob1:'#fb7185',blob2:'#f9a8d4',card:'linear-gradient(135deg,#ec4899,#f97316)',shadow:'#fbcfe8',mascots:['🍭','🧁','🍬','🍩']},
{name:'🦖 Динозавры',page:'linear-gradient(145deg,#d1fae5,#ccfbf1,#fef3c7)',blob1:'#34d399',blob2:'#2dd4bf',card:'linear-gradient(135deg,#047857,#0d9488)',shadow:'#a7f3d0',mascots:['🦖','🦕','🥚','🌋']},
{name:'🔮 Волшебство',page:'linear-gradient(145deg,#fae8ff,#ede9fe,#fce7f3)',blob1:'#d946ef',blob2:'#a78bfa',card:'linear-gradient(135deg,#9333ea,#db2777)',shadow:'#e9d5ff',mascots:['🦄','🧙‍♂️','🔮','🧚']},
{name:'❄️ Арктика',page:'linear-gradient(145deg,#ecfeff,#e0f2fe,#f8fafc)',blob1:'#67e8f9',blob2:'#bfdbfe',card:'linear-gradient(135deg,#0891b2,#3b82f6)',shadow:'#bae6fd',mascots:['🐧','🐻‍❄️','🦭','❄️']},
{name:'🚜 Ферма',page:'linear-gradient(145deg,#fef3c7,#dcfce7,#ffedd5)',blob1:'#fbbf24',blob2:'#86efac',card:'linear-gradient(135deg,#d97706,#65a30d)',shadow:'#fde68a',mascots:['🐮','🐷','🐥','🚜']},
{name:'🤖 Роботы',page:'linear-gradient(145deg,#e2e8f0,#dbeafe,#e0e7ff)',blob1:'#94a3b8',blob2:'#60a5fa',card:'linear-gradient(135deg,#475569,#2563eb)',shadow:'#cbd5e1',mascots:['🤖','⚙️','👾','🛸']},
{name:'🌈 Радуга',page:'linear-gradient(145deg,#dff7ff,#f4e7ff 45%,#fff1c7)',blob1:'#86efac',blob2:'#f9a8d4',card:'linear-gradient(135deg,#8b5cf6,#ec4899)',shadow:'#ddd6fe',mascots:['🌈','🦋','☀️','🌟']}
],cheers=['Супер! ⭐','Отлично! 🎉','Так держать! 🚀','Верно! 😎','Ура! ✨'];
let state;
function freshState(){return{attempt:0,correct:0,errors:0,current:null,pending:[],roundMistakes:{},lastKey:null,extra:false,streak:0,stars:0,themeIndex:-1}}
function key(p){return p.a+'×'+p.b}
function randomProblem(){let p,k,g=0;do{p={a:FIRST[Math.floor(Math.random()*FIRST.length)],b:SECOND[Math.floor(Math.random()*SECOND.length)],review:false};k=key(p);g++}while(k===state.lastKey&&g<20);return p}
function scheduleReview(p){const k=key(p),e=state.pending.find(x=>key(x.problem)===k);if(e)e.dueAfter=3;else state.pending.push({problem:{a:p.a,b:p.b,review:true},dueAfter:3})}
function chooseNext(){const i=state.pending.findIndex(x=>x.dueAfter<=0);return i>=0?state.pending.splice(i,1)[0].problem:randomProblem()}
function tickPending(p){const k=key(p);for(const x of state.pending)if(key(x.problem)!==k)x.dueAfter--}
function updateStats(){els.correct.textContent=state.correct;els.errors.textContent=state.errors;const t=state.correct+state.errors;els.accuracy.textContent=t?Math.round(state.correct/t*100)+'%':'—';els.streak.textContent='🔥 '+state.streak+' подряд';els.stars.textContent='⭐ '+state.stars}
function applyTheme(){let i;do{i=Math.floor(Math.random()*themes.length)}while(i===state.themeIndex&&themes.length>1);state.themeIndex=i;const t=themes[i];document.documentElement.style.setProperty('--page-bg',t.page);document.documentElement.style.setProperty('--blob1',t.blob1);document.documentElement.style.setProperty('--blob2',t.blob2);document.documentElement.style.setProperty('--card-bg',t.card);document.documentElement.style.setProperty('--card-shadow',t.shadow);els.themeLabel.textContent=t.name;els.mascot.textContent=t.mascots[Math.floor(Math.random()*t.mascots.length)]}
function showProblem(preserveFeedback=false){state.current=chooseNext();state.lastKey=key(state.current);const shown=Math.min(state.attempt+1,MAIN_ATTEMPTS);els.progress.textContent=state.extra?'Повторение':shown+' / '+MAIN_ATTEMPTS;els.bar.style.width=Math.min(state.attempt/MAIN_ATTEMPTS*100,100)+'%';els.problem.textContent=state.current.a+' × '+state.current.b;els.reviewtag.textContent=state.current.review?'🔁 Возвращаемся к этому примеру':'';applyTheme();els.answer.value='';if(!preserveFeedback){els.feedback.textContent='Какой получится ответ? 🤔';els.feedback.className='feedback'}els.answer.focus()}
function recordHistory(p,ok){const h=JSON.parse(localStorage.getItem('multiplicationHistory')||'{}'),k=key(p);h[k]||={attempts:0,errors:0};h[k].attempts++;if(!ok)h[k].errors++;localStorage.setItem('multiplicationHistory',JSON.stringify(h))}
function animate(cls){els.card.classList.remove('pop','shake');void els.card.offsetWidth;els.card.classList.add(cls)}
function confetti(){const icons=['⭐','✨','🎉','💫','🌟'];for(let i=0;i<9;i++){const s=document.createElement('span');s.className='confetti';s.textContent=icons[i%icons.length];s.style.left=(45+Math.random()*10)+'vw';s.style.top=(35+Math.random()*10)+'vh';s.style.setProperty('--x',(Math.random()*240-120)+'px');s.style.setProperty('--y',(Math.random()*-220-40)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
function finish(){els.game.classList.add('hidden');els.finish.classList.remove('hidden');confetti();const t=state.correct+state.errors,p=t?Math.round(state.correct/t*100):0;els.finalAccuracy.textContent=p+'%';els.finalSummary.textContent='⭐ '+state.correct+' правильных ответов. Отличная тренировка!';const rows=Object.entries(state.roundMistakes);els.mistakes.innerHTML=rows.length?rows.map(([k,v])=>'<li>'+k+': потренировали '+v+' раз(а)</li>').join(''):'<li>Без ошибок — потрясающе! 🎯</li>'}
function start(){state=freshState();els.finish.classList.add('hidden');els.game.classList.remove('hidden');updateStats();showProblem(false)}
$('form').addEventListener('submit',e=>{e.preventDefault();if(els.answer.value==='')return;const p=state.current,value=Number(els.answer.value),expected=p.a*p.b,ok=value===expected;recordHistory(p,ok);const main=state.attempt<MAIN_ATTEMPTS;if(ok){if(main)state.correct++;state.streak++;state.stars++;els.feedback.textContent=p.review?'Получилось! ⭐ Ошибка исправлена.':cheers[Math.floor(Math.random()*cheers.length)];els.feedback.className='feedback ok';animate('pop');if(state.streak%5===0||p.review)confetti()}else{if(main)state.errors++;state.streak=0;state.roundMistakes[key(p)]=(state.roundMistakes[key(p)]||0)+1;scheduleReview(p);els.feedback.textContent='Почти! 🌱 Ответ: '+expected+'. Попробуем снова через 3 задания.';els.feedback.className='feedback bad';animate('shake')}state.attempt++;tickPending(p);updateStats();if(state.attempt>=MAIN_ATTEMPTS)state.extra=true;setTimeout(()=>{if(state.attempt>=MAIN_ATTEMPTS&&state.pending.length===0)finish();else showProblem(true)},ok?650:1300)});
$('restart').addEventListener('click',start);$('again').addEventListener('click',start);$('clearHistory').addEventListener('click',()=>{localStorage.removeItem('multiplicationHistory');start()});start()
})();
</script></body></html>
