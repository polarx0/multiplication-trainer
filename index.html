<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Тренажёр умножения 1–9 × 1–5</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    .app{width:min(100%,520px);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.10)}
    header{display:flex;justify-content:space-between;gap:16px;align-items:center}.title{font-size:18px;font-weight:800}.progress{font-variant-numeric:tabular-nums;color:#6b7280}
    .bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:16px 0 28px}.bar>div{height:100%;width:0;background:#111827;transition:width .2s}
    .problem{text-align:center;font-size:58px;font-weight:850;letter-spacing:-2px;margin:10px 0 22px}
    .answer{width:100%;font-size:34px;text-align:center;padding:14px;border:2px solid #d1d5db;border-radius:16px;outline:none}.answer:focus{border-color:#111827}
    .feedback{min-height:28px;text-align:center;margin:14px 0;font-weight:700}.ok{color:#047857}.bad{color:#b91c1c}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}.stat{background:#f9fafb;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#6b7280}
    .panel{margin-top:18px;padding-top:18px;border-top:1px solid #e5e7eb}.panel h2{font-size:15px;margin:0 0 10px}.mistakes{margin:0;padding-left:20px;color:#4b5563}.hidden{display:none}
    .finish{text-align:center}.finish h1{margin:6px 0}.finish .big{font-size:48px;font-weight:900;margin:10px 0}
    @media(max-width:420px){.app{padding:18px;border-radius:18px}.problem{font-size:50px}}
  </style>
</head>
<body>
<main class="app">
  <section id="game">
    <header><div class="title">Умножение 1–9 × 1–5</div><div class="progress" id="progress">1 / 30</div></header>
    <div class="bar"><div id="bar"></div></div>
    <div class="problem" id="problem">8 × 4</div>
    <form id="form">
      <input id="answer" class="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="Ответ" />
      <div id="feedback" class="feedback"></div>
      <div class="buttons"><button class="btn primary" type="submit">Проверить</button><button class="btn secondary" id="restart" type="button">Заново</button></div>
    </form>
    <div class="stats"><div class="stat"><b id="correct">0</b><span>правильно</span></div><div class="stat"><b id="errors">0</b><span>ошибок</span></div><div class="stat"><b id="accuracy">—</b><span>точность</span></div></div>
  </section>

  <section id="finish" class="finish hidden">
    <h1>Раунд завершён</h1><div class="big" id="finalAccuracy">100%</div><p id="finalSummary"></p>
    <div class="panel"><h2>Ошибки этого раунда</h2><ul id="mistakes" class="mistakes"></ul></div>
    <div class="buttons" style="margin-top:20px"><button class="btn primary" id="again">Ещё 30</button><button class="btn secondary" id="clearHistory">Сбросить историю</button></div>
  </section>
</main>
<script>
(() => {
  const MAIN_ATTEMPTS = 30;
  const FIRST = [1,2,3,4,5,6,7,8,9];
  const SECOND = [1,2,3,4,5];
  const $ = id => document.getElementById(id);
  const els = {game:$('game'),finish:$('finish'),progress:$('progress'),bar:$('bar'),problem:$('problem'),answer:$('answer'),feedback:$('feedback'),correct:$('correct'),errors:$('errors'),accuracy:$('accuracy'),finalAccuracy:$('finalAccuracy'),finalSummary:$('finalSummary'),mistakes:$('mistakes')};

  let state;
  function freshState(){ return {attempt:0, correct:0, errors:0, current:null, pending:[], roundMistakes:{}, lastKey:null, extra:false}; }
  function key(p){ return `${p.a}×${p.b}`; }
  function randomProblem(){
    let p, k, guard=0;
    do { p={a:FIRST[Math.floor(Math.random()*FIRST.length)], b:SECOND[Math.floor(Math.random()*SECOND.length)], review:false}; k=key(p); guard++; }
    while(k===state.lastKey && guard<20);
    return p;
  }
  function scheduleReview(p){
    const k=key(p);
    const existing=state.pending.find(x=>key(x.problem)===k);
    if(existing) existing.dueAfter=3;
    else state.pending.push({problem:{a:p.a,b:p.b,review:true},dueAfter:3});
  }
  function chooseNext(){
    const dueIndex=state.pending.findIndex(x=>x.dueAfter<=0);
    if(dueIndex>=0) return state.pending.splice(dueIndex,1)[0].problem;
    return randomProblem();
  }
  function tickPending(completed){
    const completedKey=key(completed);
    for(const item of state.pending){ if(key(item.problem)!==completedKey) item.dueAfter--; }
  }
  function updateStats(){
    els.correct.textContent=state.correct; els.errors.textContent=state.errors;
    const total=state.correct+state.errors; els.accuracy.textContent=total?`${Math.round(state.correct/total*100)}%`:'—';
  }
  function showProblem(){
    state.current=chooseNext(); state.lastKey=key(state.current);
    const shown=Math.min(state.attempt+1,MAIN_ATTEMPTS);
    els.progress.textContent=state.extra?'Повторение':`${shown} / ${MAIN_ATTEMPTS}`;
    els.bar.style.width=`${Math.min(state.attempt/MAIN_ATTEMPTS*100,100)}%`;
    els.problem.textContent=`${state.current.a} × ${state.current.b}`;
    els.answer.value=''; els.feedback.textContent=''; els.feedback.className='feedback'; els.answer.focus();
  }
  function recordHistory(p, ok){
    const history=JSON.parse(localStorage.getItem('multiplicationHistory')||'{}'); const k=key(p);
    history[k] ||= {attempts:0,errors:0}; history[k].attempts++; if(!ok) history[k].errors++;
    localStorage.setItem('multiplicationHistory',JSON.stringify(history));
  }
  function finish(){
    els.game.classList.add('hidden'); els.finish.classList.remove('hidden');
    const total=state.correct+state.errors, pct=total?Math.round(state.correct/total*100):0;
    els.finalAccuracy.textContent=`${pct}%`; els.finalSummary.textContent=`Основные 30: правильно ${state.correct}, ошибок ${state.errors}. Все назначенные повторы завершены.`;
    const rows=Object.entries(state.roundMistakes);
    els.mistakes.innerHTML=rows.length?rows.map(([k,v])=>`<li>${k}: ошибок ${v}</li>`).join(''):'<li>Ни одной ошибки 🎯</li>';
  }
  function start(){ state=freshState(); els.finish.classList.add('hidden'); els.game.classList.remove('hidden'); updateStats(); showProblem(); }

  $('form').addEventListener('submit', e => {
    e.preventDefault(); if(els.answer.value==='') return;
    const p=state.current, value=Number(els.answer.value), expected=p.a*p.b, ok=value===expected;
    recordHistory(p,ok);
    const isMainAttempt = state.attempt < MAIN_ATTEMPTS;
    if(ok){ if(isMainAttempt) state.correct++; els.feedback.textContent=p.review?'Правильно! ✅ Ошибка исправлена.':'Правильно! ✅'; els.feedback.className='feedback ok'; }
    else { if(isMainAttempt) state.errors++; state.roundMistakes[key(p)]=(state.roundMistakes[key(p)]||0)+1; scheduleReview(p); els.feedback.textContent=`Неправильно ❌ Правильный ответ: ${expected}. Повторю через три примера.`; els.feedback.className='feedback bad'; }
    state.attempt++; tickPending(p); updateStats();
    if(state.attempt>=MAIN_ATTEMPTS) state.extra=true;
    setTimeout(()=>{
      if(state.attempt>=MAIN_ATTEMPTS && state.pending.length===0) finish(); else showProblem();
    }, ok?450:1000);
  });
  $('restart').addEventListener('click',start); $('again').addEventListener('click',start);
  $('clearHistory').addEventListener('click',()=>{localStorage.removeItem('multiplicationHistory'); start();});
  start();
})();
</script>
</body>
</html>
